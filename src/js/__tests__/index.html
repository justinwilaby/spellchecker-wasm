<!DOCTYPE html>
<html lang="en">
<head></head>
    <meta charset="UTF-8">
    <title>Web tests</title>
</head>
<body>
<script type="module">
    import { SpellcheckerWasm } from '../../../lib/esm/index.js';

    window.testResults = { passed: 0, failed: 0, errors: [] };

    function streamResponse(body, chunkSize = 3) {
        const bytes = typeof body === 'string' ? new TextEncoder().encode(body) : body;
        return new Response(new ReadableStream({
            start(controller) {
                for (let i = 0; i < bytes.length; i += chunkSize) controller.enqueue(bytes.slice(i, i + chunkSize));
                controller.close();
            }
        }));
    }

    async function runTests() {
        const spellchecker = new SpellcheckerWasm();

        let lastResults;
        spellchecker.resultHandler = results => {
            lastResults = results;
        };

        try {
            const wasm = await fetch('../../../lib/spellchecker-wasm.wasm');
            const dictionary = await fetch('../../../lib/frequency_dictionary_en_82_765.txt');
            const misspellings = await fetch('./commonMisspellings_en_82_765.json');
            const commonMisspellings = await misspellings.json();

            const t = performance.now();
            await spellchecker.prepareSpellchecker(wasm, dictionary);
            console.log(`standard dictionary loaded in ${performance.now() - t} ms`);

            for (const method of ['checkSpelling', 'checkSpellingCompound']) {
                try {
                    spellchecker[method]('hello', {maxEditDistance: 3});
                    throw new Error(`${method} accepted a distance above dictionaryEditDistance`);
                } catch (error) {
                    if (!(error instanceof RangeError) || !error.message.includes('dictionaryEditDistance')) throw error;
                }
            }

            // Exercise the original preparation path with Response streams and split lines.
            const bytes = new TextEncoder().encode('hello 100\n\nworld 90\r\n');
            const streamedDictionary = streamResponse(bytes, 3);
            const streamedChecker = new SpellcheckerWasm(results => { lastResults = results; });
            await streamedChecker.prepareSpellchecker(await fetch('../../../lib/spellchecker-wasm.wasm'), streamedDictionary);
            streamedChecker.checkSpelling('world', {maxEditDistance: 0, includeSelf: true});
            if (lastResults[0]?.term !== 'world') throw new Error('Streamed CRLF dictionary lost final term');

            try {
                await new SpellcheckerWasm().prepareSpellchecker(
                    await fetch('../../../lib/spellchecker-wasm.wasm'),
                    new Response('Not found', {status: 404})
                );
                throw new Error('Failed dictionary Response was accepted');
            } catch (error) {
                if (!error.message.includes('Dictionary Response failed: 404')) throw error;
            }

            // Issue #48: new language dictionaries via browser Response streams.
            for (const lang of ['de', 'fr', 'it', 'es', 'he', 'ru']) {
                const langDictionary = await fetch(`../../../lib/frequency_dictionary_${lang}.txt`);
                const langChecker = new SpellcheckerWasm();
                try {
                    await langChecker.prepareSpellchecker(await fetch('../../../lib/spellchecker-wasm.wasm'), langDictionary);
                } catch (error) {
                    throw new Error(`${lang} dictionary failed: ${error.message}`);
                }
                if (!langChecker.prepared) throw new Error(`${lang} dictionary did not prepare`);
            }

            // Issue #48: bigram dictionary via Response stream.
            const bigramDictionary = await fetch('../../../lib/frequency_bigramdictionary_en_243_342.txt');
            const bigramChecker = new SpellcheckerWasm();
            await bigramChecker.prepareSpellchecker(
                await fetch('../../../lib/spellchecker-wasm.wasm'),
                streamResponse('hello 100\nworld 90\n', 4),
                bigramDictionary
            );
            if (!bigramChecker.suggestCompound('hello wrld').some(item => item.term === 'hello world')) {
                throw new Error('Bigram dictionary did not load from Response stream');
            }

            // Issue #48: invalid UTF-8 mid-stream throws TypeError, does not trap.
            const invalidUtf8 = new Uint8Array([104, 101, 108, 108, 111, 32, 49, 48, 10, 255, 254, 119, 111, 114, 108, 100, 32, 50, 48, 10]);
            try {
                await new SpellcheckerWasm().prepareSpellchecker(
                    await fetch('../../../lib/spellchecker-wasm.wasm'),
                    streamResponse(invalidUtf8, 4)
                );
                throw new Error('Invalid UTF-8 dictionary was accepted');
            } catch (error) {
                if (!(error instanceof TypeError)) throw error;
            }

            // Issue #48: split multi-byte UTF-8 reassembles correctly.
            const russian = new TextEncoder().encode('слово 30\n');
            const russianChecker = new SpellcheckerWasm();
            await russianChecker.prepareSpellchecker(await fetch('../../../lib/spellchecker-wasm.wasm'), streamResponse(russian, 3));
            const russianResult = russianChecker.suggest('слово', {includeSelf: true});
            if (russianResult.length !== 1 || russianResult[0].term !== 'слово') {
                throw new Error('Split multi-byte UTF-8 character was not reassembled');
            }

            // Issue #48: CR-only line endings do not trap (documented behaviour: CR-only is not a line break).
            const crOnly = new TextEncoder().encode('hello 10\nworld 20\r\nmac 30\rnext 40\r\n');
            const crChecker = new SpellcheckerWasm();
            await crChecker.prepareSpellchecker(await fetch('../../../lib/spellchecker-wasm.wasm'), streamResponse(crOnly, 4));
            if (!crChecker.suggest('helo').some(item => item.term === 'hello')) {
                throw new Error('CR-only mixed endings broke parsing');
            }

            // Issue #48: multiple simultaneous instances do not share corrupted state.
            const instances = await Promise.all(Array.from({length: 3}, async () => {
                const instance = new SpellcheckerWasm();
                await instance.prepareSpellchecker(
                    await fetch('../../../lib/spellchecker-wasm.wasm'),
                    streamResponse('hello 100\nworld 90\n', 4)
                );
                return instance;
            }));
            for (const instance of instances) {
                if (!instance.suggest('helo').some(item => item.term === 'hello')) {
                    throw new Error('Simultaneous instance corrupted another instance');
                }
            }

            // Issue #48: re-preparing resets state.
            const resetChecker = new SpellcheckerWasm();
            await resetChecker.prepareSpellchecker(await fetch('../../../lib/spellchecker-wasm.wasm'), streamResponse('hello 100\n', 4));
            await resetChecker.prepareSpellchecker(await fetch('../../../lib/spellchecker-wasm.wasm'), streamResponse('world 50\n', 4));
            if (resetChecker.suggest('helo').length !== 0 || !resetChecker.suggest('wrld').some(item => item.term === 'world')) {
                throw new Error('Re-preparing did not reset dictionary state');
            }

            let allPassed = true;
            for (const {correctSpelling, misspellings: words} of commonMisspellings) {
                for (const word of words) {
                    const suggestions = spellchecker.suggest(word.toLowerCase());
                    const terms = suggestions.map(r => r.term);
                    if (lastResults !== suggestions) {
                        allPassed = false;
                        window.testResults.errors.push(`Callback result differs from return value for '${word}'`);
                    }
                    if (!terms.includes(correctSpelling.toLowerCase())) {
                        allPassed = false;
                        window.testResults.errors.push(
                            `Expected '${correctSpelling}' for '${word}', got: ${terms.join(', ')}`
                        );
                    }
                }
            }

            const withoutCallback = new SpellcheckerWasm();
            const wasmAgain = await fetch('../../../lib/spellchecker-wasm.wasm');
            const dictionaryAgain = await fetch('../../../lib/frequency_dictionary_en_82_765.txt');
            await withoutCallback.prepareSpellchecker(wasmAgain, dictionaryAgain);
            if (!withoutCallback.suggest('helo').some(item => item.term === 'hello') ||
                withoutCallback.suggest('hello').length !== 0 ||
                !withoutCallback.suggestCompound('hello wrld').some(item => item.term === 'hello world')) {
                allPassed = false;
                window.testResults.errors.push('Direct suggestions did not return per-call word and compound results');
            }

            if (allPassed) {
                window.testResults.passed = 1;
                console.log('All tests passed!');
            } else {
                window.testResults.failed = window.testResults.errors.length;
                console.error('Tests failed:', window.testResults.errors);
            }
        } catch (e) {
            window.testResults.errors.push(e.message);
            window.testResults.failed = 1;
            console.error('Test error:', e);
        }
    }

    runTests();
</script>
</body>
</html>
